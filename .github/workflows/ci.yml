name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: contracts
        run: forge test
      - name: go test
        working-directory: agent
        run: go test ./...
      - name: demo dry-run
        working-directory: agent
        run: go run ./cmd/pulse demo
        env:
          PULSE_DATA_DIR: /tmp/pulse-ci-data
